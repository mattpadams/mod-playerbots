          Don't kill Moira — she's a reward NPC.
        tank: Pull Thaurissan AWAY from Princess Moira.
        healer: AoE.
        dps: Burn Thaurissan. Don't hit Princess Moira.
        mechanics:
          - Hand of Thaurissan — knockback
          - Princess Moira heals him — move away or CC her
          - AVOID KILLING Princess Moira (quest NPC)
