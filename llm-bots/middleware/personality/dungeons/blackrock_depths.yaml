    order: 1
    aliases: [Gerstahn]
    phases:
      - name: Active
        hp_threshold: null
        description: Priest boss, Detention Block.
        tank: Central.
        healer: Dispel.
        dps: "Interrupt Shadow Word: Pain. Interrupt heals."
        mechanics:
          - Mind Blast
          - Smite

  - name: Ring of Law
