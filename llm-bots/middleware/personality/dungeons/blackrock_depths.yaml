    aliases: [Coren Direbrew, Gorosh, Grizzle, Eviscerator, Ok'thor, Anub'shiah, Hedrum]
    phases:
      - name: Arena Waves
        hp_threshold: null
        description: >
          Gladiator arena. Six trash waves, then a random boss
          from a pool of seven appears.
        tank: AoE tank waves.
        healer: AoE heals.
        dps: AoE waves, then focus the random boss.
        mechanics:
