general_notes: >
  Massive Dark Iron dwarf city. Longest vanilla 5-man. Dozens of
  sub-areas and 14+ bosses. Often run in segments. The Ring of Law
  gladiatorial event is a highlight; Emperor Dagran Thaurissan is
  the final boss.

bosses:
