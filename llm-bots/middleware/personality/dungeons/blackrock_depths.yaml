  - name: Emperor Dagran Thaurissan
    order: 14
    aliases: [Thaurissan, Dagran]
    phases:
      - name: Active
        hp_threshold: null
        description: >
          Dark Iron emperor. Final boss. Casts Hand of Thaurissan
